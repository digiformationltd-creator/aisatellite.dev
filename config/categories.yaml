categories:
  - id: "free-ai-tools"
    name: "Free AI Developer Tools"
    queries:
      - "topic:ai-tools free developer"
      - "ai developer productivity open source"
    inclusionCriteria:
      - "Offers developer API, CLI, or library"
      - "Has perpetual free tier or OSI open source"
    exclusionCriteria:
      - "Credit card required trials"
      - "Proprietary without free access"
    minEvidenceCount: 2
    allowedLicenses:
      - "MIT"
      - "Apache-2.0"
      - "AGPL-3.0"
      - "BSD-3-Clause"
      - "GPL-3.0"
    updateFrequencyDays: 3
    priority: "high"

  - id: "local-llm"
    name: "Local LLM & Inference Engines"
    queries:
      - "topic:llm-inference local"
      - "topic:llama-cpp"
      - "topic:local-ai"
    inclusionCriteria:
      - "Runs offline on consumer hardware (CPU or GPU)"
      - "Open source or clear royalty-free license"
    exclusionCriteria:
      - "Cloud-only proxies"
    minEvidenceCount: 2
    allowedLicenses:
      - "MIT"
      - "Apache-2.0"
      - "GPL-3.0"
    updateFrequencyDays: 2
    priority: "critical"

  - id: "ai-coding"
