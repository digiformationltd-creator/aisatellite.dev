<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Space Core -->
  <circle cx="32" cy="32" r="30" fill="#0a0f1d" stroke="#1d2940" stroke-width="2"/>
  <!-- Orbital Rings -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#grad-cyan)" stroke-width="2" transform="rotate(-30 32 32)" opacity="0.85"/>
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3" transform="rotate(35 32 32)" opacity="0.5"/>
  <!-- Central Satellite Sensor Node -->
  <circle cx="32" cy="32" r="6" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <!-- Satellite Solar Arrays -->
  <rect x="18" y="22" width="6" height="4" rx="1" fill="#8b5cf6" transform="rotate(-30 21 24)"/>
  <rect x="40" y="36" width="6" height="4" rx="1" fill="#8b5cf6" transform="rotate(-30 43 38)"/>
  <!-- Data Beacons -->
  <circle cx="48" cy="18" r="1.5" fill="#00f0ff"/>
  <circle cx="16" cy="46" r="1.5" fill="#10b981"/>
</svg>
