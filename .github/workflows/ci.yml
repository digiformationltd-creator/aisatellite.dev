name: AI Satellite Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Astro Diagnostic Check
        run: npm run check

      - name: Run Schema Integrity Tests
        run: npm run test

      - name: Build Production Bundle & Search Index
        run: npm run build
