name: 02 - Resource Verification & Scoring

# Scheduled at 02:00 UTC (07:00 PKT / Pakistan Standard Time)
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  verify:
    name: Verify Licensing, Free Tiers & Quality Scores
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Pipeline
        run: npm run verify

      - name: Commit Verified Resources
        run: |
          git config --local user.email "bot@aisatellite.pages.dev"
          git config --local user.name "AI Satellite Verification Bot"
          git add data/verified/ data/candidates/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(verification): update verified resource index [skip ci]"
          git push || echo "No changes to push"
