name: 04 - Content Freshness & Link Monitor

# Runs weekly on Sunday at 19:00 UTC (Monday 00:00 PKT)
on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

jobs:
  monitor:
    name: Audit Freshness & Broken Links
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Freshness & Link Monitor
        run: npm run monitor

      - name: Commit Freshness Audit Report
        run: |
          git config --local user.email "bot@aisatellite.pages.dev"
          git config --local user.name "AI Satellite Monitor"
          git add data/reports/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(monitoring): weekly link health & freshness report [skip ci]"
          git push || echo "No changes to push"
