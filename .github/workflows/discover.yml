name: 01 - Autonomous Source Discovery

# Scheduled at 01:00 UTC (06:00 PKT / Pakistan Standard Time)
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  discover:
    name: Discover Open-Source & Developer Tools
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Source Discovery Connector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run discover

      - name: Commit New Discovery Candidates
        run: |
          git config --local user.email "bot@aisatellite.pages.dev"
          git config --local user.name "AI Satellite Discovery Bot"
          git add data/candidates/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(discovery): update candidate resources [skip ci]"
          git push || echo "No changes to push"
